{% extends "main.html" %}

{% block tabs %}
  {{ super() }}

  {% if "home" in page.meta.template %}
    <style>
      /* Integrated Home Page Overrides */
      .md-container {
        padding-top: 0 !important;
      }
      .md-header {
        position: absolute !important;
        top: 0 !important;
        left: 0;
        right: 0;
        z-index: 1000;
      }
      .md-header__inner {
        background: rgba(255, 255, 255, 0.1) !important;
        backdrop-filter: blur(20px) !important;
        -webkit-backdrop-filter: blur(20px) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2) !important;
      }
      [data-md-color-scheme="slate"] .md-header__inner {
        background: rgba(13, 17, 23, 0.2) !important;
      }
      
      /* Force Hero to pixel 0 */
      .paperclip-hero {
        margin-top: 0 !important;
        padding-top: 0 !important;
      }
    </style>

    <section class="paperclip-hero">
      <div class="paperclip-image-container">
        <img src="{{ 'assets/header.webp' | url }}" alt="Galyarder Agent" draggable="false">
        <div class="paperclip-mask"></div>
      </div>
      <div class="paperclip-inner md-grid">
        <div class="paperclip-content">
          <h1>Galyarder Agent</h1>
          <p class="paperclip-subtitle">
            Agentic digital identity for what should not disappear. Build characters with memory, values, and visual presence.
          </p>
          <div class="paperclip-actions">
            <a href="getting-started/" title="Get started" class="md-button md-button--primary">
              Get started
            </a>
            <a href="configuration/" title="Configuration" class="md-button">
              Configuration
            </a>
          </div>
        </div>
      </div>
    </section>
  {% endif %}
{% endblock %}
