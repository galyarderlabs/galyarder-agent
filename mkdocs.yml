site_name: Galyarder Agent
site_description: Practical, secure, self-hosted personal AI assistant documentation.
site_url: https://galyarderlabs.github.io/galyarder-agent/
repo_url: https://github.com/galyarderlabs/galyarder-agent
repo_name: galyarderlabs/galyarder-agent
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - announce.dismiss
    - content.action.edit
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - content.code.annotate
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Embedding: embedding.md
  - Install Matrix: install-matrix.md
  - Configuration: configuration.md
  - Plugins: plugins.md
  - CLI Commands: cli-commands.md
  - Channels: channels.md
  - Visual Identity & Persona: persona.md
  - Operations: operations.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Security: security.md
  - Contributing: contributing.md
  - CLI Error Style: cli-error-style.md
  - Release Notes:
      - v0.1.12: release-notes/v0.1.12.md
      - v0.1.11: release-notes/v0.1.11.md
      - v0.1.10: release-notes/v0.1.10.md
      - v0.1.9: release-notes/v0.1.9.md
      - v0.1.8: release-notes/v0.1.8.md
      - v0.1.7: release-notes/v0.1.7.md
      - v0.1.6: release-notes/v0.1.6.md
      - v0.1.5: release-notes/v0.1.5.md
  - Roadmap:
      - Runtime Roadmap: roadmap/runtime-roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/galyarderlabs/galyarder-agent

extra_css:
  - styles/extra.css
