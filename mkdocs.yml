site_name: Galyarder Agent
site_description: Self-hosted agentic digital identity and character runtime documentation.
site_url: https://galyarderlabs.github.io/galyarder-agent/
repo_url: https://github.com/galyarderlabs/galyarder-agent
repo_name: galyarderlabs/galyarder-agent
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.webp
  favicon: assets/logo.webp
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Embedding: embedding.md
  - Install Matrix: install-matrix.md
  - Configuration: configuration.md
  - Plugins: plugins.md
  - CLI Commands: cli-commands.md
  - Channels: channels.md
  - Visual Identity & Persona: persona.md
  - Operations: operations.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Security: security.md
  - Contributing: contributing.md
  - Code Review: code-review.md
  - CLI Error Style: cli-error-style.md
  - Roadmap:
      - Overview: roadmap/README.md
      - Completion TODO: roadmap/TODO.md
      - Codebase Deep-Dive Audit: roadmap/00-codebase-deep-dive-audit.md
      - Hermes And Nanobot Reference Audit: reports/hermes-nanobot-reference-audit.md
      - v0.1 Stabilize Current Runtime: roadmap/v0.1-stabilize-current-runtime.md
      - v0.2 Session Store And Recall: roadmap/v0.2-session-store-and-recall.md
      - v0.3 Commands Logs And Approvals: roadmap/v0.3-commands-logs-approvals.md
      - v0.4 Core Channel Reliability: roadmap/v0.4-core-channel-reliability.md
      - v0.5 Web UI And OpenAI API: roadmap/v0.5-web-ui-openai-api.md
      - v0.6 Character Profiles And Visual Identity: roadmap/v0.6-character-profiles-visual-identity.md
      - v0.7 Memory Manager And Owner Model: roadmap/v0.7-memory-manager-owner-model.md
      - v0.8 Owner Reviewed Learning Loop: roadmap/v0.8-owner-reviewed-learning-loop.md
      - v0.9 Skills As Procedural Memory: roadmap/v0.9-skills-procedural-memory.md
      - v0.10 Context Engine And Compression: roadmap/v0.10-context-engine-compression.md
      - v0.11 Routines Cron And Triggers: roadmap/v0.11-routines-cron-triggers.md
      - v0.12 Toolsets MCP And Execution Backends: roadmap/v0.12-toolsets-mcp-execution.md
      - v0.13 Insights Packaging And Public Trust: roadmap/v0.13-insights-packaging-public-trust.md
  - Release Notes:
      - Checklist: release-notes/checklist.md
      - v0.1.13: release-notes/v0.1.13.md
      - v0.1.12: release-notes/v0.1.12.md
      - v0.1.11: release-notes/v0.1.11.md
      - v0.1.10: release-notes/v0.1.10.md
      - v0.1.9: release-notes/v0.1.9.md
      - v0.1.8: release-notes/v0.1.8.md
      - v0.1.7: release-notes/v0.1.7.md
      - v0.1.6: release-notes/v0.1.6.md
      - v0.1.5: release-notes/v0.1.5.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/galyarderlabs/galyarder-agent

copyright: "© 2026 Galyarder Labs."

extra_css:
  - styles/extra.css
